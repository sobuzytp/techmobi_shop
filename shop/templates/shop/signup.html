{% extends 'shop/base.html' %}

{% block title %}Sign up - TechMobi{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 480px;">
    <h2 class="fw-bold mb-4"><i class="bi bi-person-plus"></i> Create an account</h2>
    <div class="card p-4 border-0 shadow-sm">
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-techmobi w-100">Sign up</button>
        </form>
        <p class="text-center text-muted mt-3 mb-0">
            Already have an account? <a href="{% url 'shop:login' %}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
